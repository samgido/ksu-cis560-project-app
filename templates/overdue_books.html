{% extends 'base.html' %}
{% block content %}

{% for obook in books %}
	<div class="list_display_div">
	<img src="{{ obook.book.cover_img_url }}" class="book_list_display_cover_img" />

	<p><em>{{ obook.book.title }}</em></p>

	<p>{{ obook.loaner_email }}</p>

	<a href="{{ url_for('view.return_book', email=obook.loaner_email, book_id=obook.book.book_id) }}">
		<button>Return</button>
	</a>
	</div>
{% endfor %}

{% endblock %}
